---
# tasks file for roles/aws_tools

- name: Install AWS CLI (Ubuntu package)
  when: aws_tools_install_cli | bool
  ansible.builtin.apt:
    name: awscli
    state: present
    update_cache: true

- name: Ensure AWS config directory exists
  when:
    - aws_user is defined
    - aws_user | length > 0
  ansible.builtin.file:
    path: "/home/{{ aws_user }}/.aws"
    state: directory
    owner: "{{ aws_user }}"
    group: "{{ aws_user }}"
    mode: "0700"

- name: Configure AWS CLI profiles (config)
  when:
    - aws_profiles is defined
    - aws_profiles | length > 0
  block:
    - name: Set profile region
      when: aws_profile.region is defined
      community.general.ini_file:
        path: "/home/{{ aws_user }}/.aws/config"
        section: "{{ 'default' if aws_profile.name == 'default' else 'profile ' ~ aws_profile.name }}"
        option: region
        value: "{{ aws_profile.region }}"
        owner: "{{ aws_user }}"
        group: "{{ aws_user }}"
        mode: "0600"
        create: true

    - name: Set profile output
      when: aws_profile.output is defined
      community.general.ini_file:
        path: "/home/{{ aws_user }}/.aws/config"
        section: "{{ 'default' if aws_profile.name == 'default' else 'profile ' ~ aws_profile.name }}"
        option: output
        value: "{{ aws_profile.output }}"
        owner: "{{ aws_user }}"
        group: "{{ aws_user }}"
        mode: "0600"
        create: true
  loop: "{{ aws_profiles }}"
  loop_control:
    loop_var: aws_profile

- name: Configure AWS CLI profiles (credentials)
  when:
    - aws_write_credentials | bool
    - aws_profiles is defined
    - aws_profiles | length > 0
  block:
    - name: Set access key id
      when: aws_profile.access_key_id is defined
      community.general.ini_file:
        path: "/home/{{ aws_user }}/.aws/credentials"
        section: "{{ aws_profile.name }}"
        option: aws_access_key_id
        value: "{{ aws_profile.access_key_id }}"
        owner: "{{ aws_user }}"
        group: "{{ aws_user }}"
        mode: "0600"
        create: true

    - name: Set secret access key
      when: aws_profile.secret_access_key is defined
      no_log: true
      community.general.ini_file:
        path: "/home/{{ aws_user }}/.aws/credentials"
        section: "{{ aws_profile.name }}"
        option: aws_secret_access_key
        value: "{{ aws_profile.secret_access_key }}"
        owner: "{{ aws_user }}"
        group: "{{ aws_user }}"
        mode: "0600"
        create: true
  loop: "{{ aws_profiles }}"
  loop_control:
    loop_var: aws_profile
