---
# tasks file for roles/aws_tools

- name: Install AWS CLI (Ubuntu package)
  when: aws_tools_install_cli | bool
  ansible.builtin.apt:
    name: awscli
    state: present
    update_cache: true

- name: Ensure AWS config directory exists
  when:
    - aws_user is defined
    - aws_user | length > 0
  ansible.builtin.file:
    path: "/home/{{ aws_user }}/.aws"
    state: directory
    owner: "{{ aws_user }}"
    group: "{{ aws_user }}"
    mode: "0700"
